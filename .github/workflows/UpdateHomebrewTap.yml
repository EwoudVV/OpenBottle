name: Update OpenBottle Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: OpenBottle app release tag, such as app-v0.1.0
        required: true

permissions:
  contents: read

jobs:
  update-tap:
    if: ${{ vars.HOMEBREW_TAP_REPOSITORY != '' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'app-v')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Bump OpenBottle cask
        env:
          BREW_TOKEN: ${{ secrets.BREW_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          set -euo pipefail
          [ -n "${BREW_TOKEN:-}" ] || { echo "::error::BREW_TOKEN is not set"; exit 1; }

          version="${TAG#app-v}"
          printf '%s' "$version" | grep -qE '^[0-9]+(\.[0-9]+)*$' \
            || { echo "::error::invalid app release tag: $TAG"; exit 1; }

          url="https://github.com/EwoudVV/OpenBottle/releases/download/${TAG}/OpenBottle-${version}.dmg"
          curl -fSL "$url" -o openbottle.dmg
          sha="$(sha256sum openbottle.dmg | awk '{print $1}')"

          git clone --depth 1 "https://x-access-token:${BREW_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap
          cd tap
          test -f Casks/openbottle.rb
          sed -i -E "s/version \"[^\"]+\"/version \"${version}\"/" Casks/openbottle.rb
          sed -i -E "s/sha256 \"[0-9a-f]{64}\"/sha256 \"${sha}\"/" Casks/openbottle.rb
          grep -qF "version \"${version}\"" Casks/openbottle.rb
          grep -qF "sha256 \"${sha}\"" Casks/openbottle.rb

          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "openbottle ${version}"
          git push
