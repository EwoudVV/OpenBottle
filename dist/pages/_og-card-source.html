<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenBottle card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { background: #10131a; color: #f7f8fb; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
    main { width: 100%; height: 100%; padding: 78px 88px; display: flex; flex-direction: column; justify-content: center; background: radial-gradient(circle at 82% 12%, #244b9a 0, transparent 42%), radial-gradient(circle at 8% 100%, #193055 0, transparent 38%); }
    .mark { width: 78px; height: 78px; margin-bottom: 30px; border: 7px solid #7ca5ff; border-top-color: transparent; border-radius: 22px 22px 34px 34px; transform: rotate(45deg); }
    h1 { font-size: 122px; line-height: .95; letter-spacing: -.055em; }
    p { margin-top: 24px; max-width: 850px; color: #b8c2d8; font-size: 35px; line-height: 1.22; }
    small { position: absolute; right: 88px; bottom: 58px; color: #7f8ba5; font-size: 21px; }
  </style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <h1>OpenBottle</h1>
    <p>compatible Windows games on Mac, with a working setup kept for each one.</p>
    <small>github.com/EwoudVV/OpenBottle</small>
  </main>
</body>
</html>
